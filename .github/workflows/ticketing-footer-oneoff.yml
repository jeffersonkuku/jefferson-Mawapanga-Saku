name: One-time repair of ticketing documentation screenshots
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ticketing-footer-oneoff.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Align profile footer and remove name on Outlook image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import hashlib
          
          root = Path("projects/power-platform-ticketing-system/assets")
          names = ["08-settings_4K.png", "10-delegations_4K.png", "12-ticket-detail_4K.png"]
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          font = ImageFont.truetype(font_path, 12)
          avatar_font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 15)
          
          def sidebar_end(im):
              pix = im.load()
              last = [y for y in range(im.height-110, im.height) if max(pix[8,y][:3]) < 65]
              if not last: raise RuntimeError("Unable to detect sidebar lower edge")
              return max(last)
          
          for filename in names:
              path = root / filename
              im = Image.open(path).convert("RGB")
              w,h = im.size
              if not (1850 <= w <= 2000 and 860 <= h <= 950):
                  raise RuntimeError(f"Unexpected dimensions: {filename}: {w}x{h}")
              original = hashlib.sha256(path.read_bytes()).hexdigest()[:12]
              y = sidebar_end(im)
              bg = im.getpixel((300,h-2))
              sidebar = im.getpixel((20,h-145))
              draw = ImageDraw.Draw(im)
              # Remove any footer background overflowing the dark sidebar.
              if y+1 < h: draw.rectangle((0,y+1,294,h-1), fill=bg)
              # Restore a clean, contained footer and align avatar + two text baselines.
              draw.rectangle((2,y-77,287,y), fill=sidebar)
              avatar_x,avatar_y = 14,y-54
              draw.rounded_rectangle((avatar_x,avatar_y,avatar_x+42,avatar_y+42),radius=2,fill=(255,196,0))
              draw.text((avatar_x+21,avatar_y+21),"A",font=avatar_font,anchor="mm",fill=(24,24,24))
              draw.text((68,y-51),"JEFFERSON MAWAPANGA SAKU",font=font,anchor="lt",fill=(245,245,245))
              draw.text((68,y-29),"Administrateur principal",font=font,anchor="lt",fill=(219,223,230))
              # Footer must stay inside the sidebar.
              assert y-77 > 0 and y <= h-1
              im.save(path,optimize=True)
              print(f"updated {filename} ({w}x{h}), bottom={y}, sha256(previous)={original}")
          
          filename="13-outlook-archive_4K.png"
          path=root/filename
          im=Image.open(path).convert("RGB")
          if not (1850 <= im.width <= 2000 and 860 <= im.height <= 950):
              raise RuntimeError("Unexpected dimensions for Outlook capture")
          # Erase the bottom-left name on the uniform dark modal backdrop only.
          pix=im.load()
          for yy in range(809,850):
              colour=pix[36,yy]
              for xx in range(52,283):
                  pix[xx,yy]=colour
          im.save(path,optimize=True)
          print(f"updated {filename}: removed lower-left name")
          
      - name: Commit the four updated PNG files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- projects/power-platform-ticketing-system/assets/08-settings_4K.png projects/power-platform-ticketing-system/assets/10-delegations_4K.png projects/power-platform-ticketing-system/assets/12-ticket-detail_4K.png projects/power-platform-ticketing-system/assets/13-outlook-archive_4K.png
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: align user footer on ticketing screenshots and remove Outlook watermark"
          git push
