name: RoadWords public CDN smoke test

on:
  push:
    branches: [main]
    paths:
      - 'roadwords-au-dist/**'
      - '.github/workflows/roadwords-public-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public app through jsDelivr
        shell: bash
        run: |
          set -e
          BASE="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_SHA}/roadwords-au-dist"

          ok=0
          for i in $(seq 1 20); do
            echo "Attempt $i: $BASE/"
            code=$(curl -L -sS --max-time 20 -o /tmp/index.html -w "%{http_code}" "$BASE/index.html" || true)
            if [ "$code" = "200" ] && grep -q "RoadWords AU" /tmp/index.html; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"

          curl -L --fail --max-time 20 "$BASE/words-3000.json" -o /tmp/words.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/words.json'))
          assert len(d)==3000, len(d)
          print('Public vocabulary OK:',len(d))
          PY

          asset=$(grep -oE 'src="\./assets/[^"]+\.js"' /tmp/index.html | head -1 | cut -d'"' -f2)
          test -n "$asset"
          curl -L --fail --max-time 20 "$BASE/${asset#./}" -o /tmp/app.js
          test "$(wc -c </tmp/app.js)" -gt 10000
          echo "Public RoadWords app and JS bundle OK"