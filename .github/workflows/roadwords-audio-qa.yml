name: RoadWords Audio QA

on:
  push:
    branches: [main]
    paths:
      - 'roadwords-au/**'
      - '.github/workflows/roadwords-audio-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract and validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path('roadwords-au/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>', html)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('scripts:', len(scripts), 'bytes:', pathlib.Path('/tmp/app.js').stat().st_size)
          PY
          node --check /tmp/app.js

      - name: Validate first 12 human audio URLs
        shell: bash
        run: |
          python - <<'PY' >/tmp/urls.txt
          import re, pathlib
          html = pathlib.Path('roadwords-au/index.html').read_text(encoding='utf-8')
          urls = re.findall(r'"audio":"([^"]+)"', html)
          for u in urls[:12]:
              print(u.replace('\\/','/'))
          PY
          set -e
          n=0
          while IFS= read -r url; do
            n=$((n+1))
            echo "Checking $n $url"
            code=$(curl -L -sS --max-time 20 -o /tmp/a.mp3 -w "%{http_code}" "$url")
            ctype=$(file -b --mime-type /tmp/a.mp3 || true)
            bytes=$(wc -c </tmp/a.mp3)
            echo "HTTP=$code type=$ctype bytes=$bytes"
            test "$code" = "200"
            test "$bytes" -gt 1000
          done </tmp/urls.txt

      - name: Verify known Australian audio test file
        shell: bash
        run: |
          URL='https://upload.wikimedia.org/wikipedia/commons/transcoded/b/b4/En-au-run.ogg/En-au-run.ogg.mp3'
          code=$(curl -L -sS --max-time 20 -o /tmp/run.mp3 -w "%{http_code}" "$URL")
          echo "HTTP=$code"
          file /tmp/run.mp3
          wc -c /tmp/run.mp3
          test "$code" = "200"
          test "$(wc -c </tmp/run.mp3)" -gt 1000
