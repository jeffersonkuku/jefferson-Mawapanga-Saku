name: Deploy RoadWords AU

on:
  push:
    branches: ["main"]
    paths:
      - "roadwords-au/**"
      - ".github/workflows/deploy-roadwords-au.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload RoadWords AU
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./roadwords-au"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
