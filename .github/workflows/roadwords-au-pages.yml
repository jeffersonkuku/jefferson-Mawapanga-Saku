name: Deploy RoadWords AU

on:
  push:
    branches: [main]
    paths:
      - 'roadwords-au/**'
      - '.github/workflows/roadwords-au-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: roadwords-au-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable or update GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload RoadWords AU
        uses: actions/upload-pages-artifact@v4
        with:
          path: roadwords-au

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
