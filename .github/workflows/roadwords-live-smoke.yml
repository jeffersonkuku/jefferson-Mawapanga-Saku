name: RoadWords live smoke test

on:
  push:
    branches: [main]
    paths:
      - 'roadwords-au/**'
      - '.github/workflows/roadwords-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages and verify deployed build
        shell: bash
        run: |
          BASE='https://jeffersonkuku.github.io/jefferson-Mawapanga-Saku/roadwords-au'
          ok=0
          for i in $(seq 1 20); do
            echo "Attempt $i"
            code=$(curl -L -sS --max-time 20 -o /tmp/index.html -w "%{http_code}" "$BASE/" || true)
            js=$(curl -L -sS --max-time 20 -o /tmp/app.js -w "%{http_code}" "$BASE/app.js?v=7" || true)
            echo "index=$code app.js=$js"
            if [ "$code" = "200" ] && [ "$js" = "200" ] && grep -q 'rw-native-tts-v7' /tmp/app.js && grep -q 'MÉTHODE SIMPLE' /tmp/index.html; then
              ok=1
              break
            fi
            sleep 15
          done
          test "$ok" = "1"
          echo "RoadWords live deployment is current."
