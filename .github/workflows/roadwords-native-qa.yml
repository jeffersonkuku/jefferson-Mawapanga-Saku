name: RoadWords native QA

on:
  push:
    branches: [main]
    paths:
      - 'roadwords-au/**'
      - '.github/workflows/roadwords-native-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: node --check roadwords-au/app.js

      - name: Validate vocabulary and architecture
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('roadwords-au')
          words=json.loads((root/'words-3000.json').read_text(encoding='utf-8'))
          assert len(words)==3000, len(words)
          assert all({'en','fr','rank'} <= set(x) for x in words)
          js=(root/'app.js').read_text(encoding='utf-8')
          html=(root/'index.html').read_text(encoding='utf-8')
          assert 'speechSynthesis' in js
          assert "en-au" in js.lower()
          assert 'words-3000.json' in js
          assert 'audio-map.json' not in js
          assert 'wikimedia' not in js.lower()
          assert '.ogg' not in js.lower()
          assert 'app.js' in html and 'style.css' in html
          print('3000 words OK')
          print('native speech architecture OK')
          PY

      - name: Smoke-test static files over HTTP
        run: |
          cd roadwords-au
          python -m http.server 8000 >/tmp/roadwords-server.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          sleep 1
          for path in / /app.js /style.css /words-3000.json /manifest.webmanifest; do
            code=$(curl -sS -o /tmp/out -w "%{http_code}" "http://127.0.0.1:8000$path")
            echo "$path -> $code"
            test "$code" = "200"
            test "$(wc -c </tmp/out)" -gt 20
          done
