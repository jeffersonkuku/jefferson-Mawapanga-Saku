name: Generate Native English Audio

on:
  workflow_dispatch:
  push:
    paths:
      - "native-english-coach/audio-build-trigger.txt"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --disable-pip-version-check edge-tts
      - name: Generate MP3 corpus
        run: python native-english-coach/scripts/generate_audio.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-english-coach/audio native-english-coach/audio-index.json native-english-coach/irregular-course.m4a native-english-coach/irregular-course-cues.json
          if git diff --cached --quiet; then
            echo "No audio changes"
          else
            git commit -m "Generate native neural English audio"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
