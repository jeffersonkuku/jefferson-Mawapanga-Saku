name: Native English Coach UI QA

on:
  workflow_dispatch:
  push:
    paths:
      - "native-english-coach/ui-qa-trigger.txt"

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium
      - name: Start static server
        run: |
          cd native-english-coach
          python3 -m http.server 4173 > /tmp/native-coach-server.log 2>&1 &
          echo $! > /tmp/native-coach-server.pid
          sleep 2
      - name: Run UI smoke test
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors=[];
          page.on('console', msg => { if (msg.type()==='error') errors.push('console: '+msg.text()); });
          page.on('pageerror', err => errors.push('pageerror: '+err.message));
          await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});
          const checks=[];
          async function check(name, fn){
            try{ await fn(); checks.push(name+': OK'); }
            catch(e){ checks.push(name+': FAIL '+e.message); errors.push(name+': '+e.stack); }
          }
          await check('home visible', async()=> {
            if(!(await page.locator('#homeView').evaluate(el=>el.classList.contains('active')))) throw new Error('home not active');
          });
          await check('settings', async()=> {
            await page.click('#settingsBtn'); await page.waitForTimeout(200);
            if(!(await page.locator('#settingsView').evaluate(el=>el.classList.contains('active')))) throw new Error('settings not active');
            await page.click('#settingsView [data-home]'); await page.waitForTimeout(100);
          });
          await check('normal mode + displayed word audio mapping', async()=> {
            await page.click('[data-mode="normal"]'); await page.waitForTimeout(300);
            if(!(await page.locator('#studyView').evaluate(el=>el.classList.contains('active')))) throw new Error('study not active');
            const displayed=(await page.locator('#term').textContent()).trim();
            const expected=await page.evaluate((term)=>{
              const item=(window.__NATIVE_COACH_SEED__||[]).find(x=>x.term===term);
              return item ? item.id+'-term.mp3' : null;
            },displayed);
            if(!expected) throw new Error('cannot resolve displayed term '+displayed);
            const reqPromise=page.waitForRequest(req=>req.url().includes('-term.mp3'),{timeout:6000});
            await page.click('#speakBtn');
            const req=await reqPromise;
            if(!req.url().includes(expected)) throw new Error('display/audio mismatch: '+displayed+' expected '+expected+' got '+req.url());
            await page.click('#studyView [data-home]'); await page.waitForTimeout(100);
          });
          await check('normal words auto opens resume picker', async()=> {
            await page.click('[data-mode="intensive-auto"]'); await page.waitForTimeout(300);
            if(!(await page.locator('#generalStartView').evaluate(el=>el.classList.contains('active')))) throw new Error('general resume picker not active');
            if((await page.locator('#generalWordSelect option').count())!==120) throw new Error('general picker should contain 120 words');
            await page.click('#generalStartView [data-home]'); await page.waitForTimeout(100);
          });
          await check('intensive calm mode', async()=> {
            await page.click('[data-mode="intensive-calm"]'); await page.waitForTimeout(300);
            if(!(await page.locator('#studyView').evaluate(el=>el.classList.contains('active')))) throw new Error('study not active');
            await page.click('#studyView [data-home]'); await page.waitForTimeout(100);
          });
          await check('listening mode', async()=> {
            await page.click('[data-mode="listening"]'); await page.waitForTimeout(500);
            if(!(await page.locator('#studyView').evaluate(el=>el.classList.contains('active')))) throw new Error('study not active');
            await page.click('#studyView [data-home]'); await page.waitForTimeout(100);
          });
          await check('speaking mode', async()=> {
            await page.click('[data-mode="speaking"]'); await page.waitForTimeout(300);
            if(!(await page.locator('#studyView').evaluate(el=>el.classList.contains('active')))) throw new Error('study not active');
            await page.click('#studyView [data-home]'); await page.waitForTimeout(100);
          });
          await check('browse', async()=> {
            await page.click('[data-mode="browse"]'); await page.waitForTimeout(300);
            if(!(await page.locator('#browseView').evaluate(el=>el.classList.contains('active')))) throw new Error('browse not active');
            if((await page.locator('#browseList .setting').count())===0) throw new Error('browse empty');
            await page.click('#browseView [data-home]'); await page.waitForTimeout(100);
          });
          await check('normal words use exact same continuous auto sequence', async()=> {
            const result=await page.evaluate(async()=>{
              const r=await fetch('./general-course-cues.json?qa='+Date.now(),{cache:'no-store'});
              const data=await r.json();
              const head=await fetch('./general-course-mobile.m4a',{method:'HEAD',cache:'no-store'});
              const first=data.cards[0], second=data.cards[1];
              return {
                cards:data.cards.length,
                size:+(head.headers.get('content-length')||0),
                firstTerm:first.term,
                firstPhon:first.phoneticFr,
                phases:first.phases.map(p=>({phase:p.phase,repetition:p.repetition||0,start:p.start,end:p.end})),
                firstEnd:first.end,
                secondStart:second.start
              };
            });
            if(result.cards!==120) throw new Error('wrong normal-course count '+JSON.stringify(result));
            if(result.size<1000000) throw new Error('normal continuous course missing '+JSON.stringify(result));
            const expected=['word','think','french','repeat','repeat','repeat','example'];
            if(result.phases.map(x=>x.phase).join(',')!==expected.join(',')) throw new Error('wrong normal phase order '+JSON.stringify(result));
            if(result.phases.filter(x=>x.phase==='repeat').map(x=>x.repetition).join(',')!=='1,2,3') throw new Error('wrong normal repeat count '+JSON.stringify(result));
            const think=result.phases.find(x=>x.phase==='think');
            if(Math.abs((think.end-think.start)-2)>0.08) throw new Error('normal think gap is not 2 seconds '+JSON.stringify(result));
            if(Math.abs(result.firstEnd-result.secondStart)>0.01) throw new Error('normal cards do not chain '+JSON.stringify(result));
            if(!result.firstPhon) throw new Error('normal French-readable pronunciation missing '+JSON.stringify(result));
          });
          await check('normal picker starts auto course at chosen word with one play', async()=> {
            const result=await page.evaluate(async()=>{
              activeList='general';updateListUI();
              await loadGeneralCourse();
              const chosen=generalCourseCues[10];
              generalSelectedStartId=chosen.id;
              await startIntensiveAuto();
              const oldPlay=generalCourseAudio.play.bind(generalCourseAudio);
              let plays=0;
              generalCourseAudio.play=async()=>{plays++;};
              await document.querySelector('#startDrive').click();
              await new Promise(r=>setTimeout(r,50));
              const out={
                chosen:chosen.id,
                currentTime:generalCourseAudio.currentTime,
                chosenStart:chosen.start,
                item:lastDriveItem?.id||null,
                plays,
                running:driveRunning,
                question:document.querySelector('#knowledgeQuestion').style.display
              };
              generalCourseAudio.play=oldPlay;
              stopDrive();
              activeList='general';updateListUI();
              return out;
            });
            if(result.item!==result.chosen) throw new Error('normal chosen word mismatch '+JSON.stringify(result));
            if(Math.abs(result.currentTime-result.chosenStart)>.2) throw new Error('normal chosen start mismatch '+JSON.stringify(result));
            if(result.plays!==1 || !result.running) throw new Error('normal auto not one continuous play '+JSON.stringify(result));
            if(result.question!=='none') throw new Error('normal auto must not ask Yes/No '+JSON.stringify(result));
          });
          await check('known answer creates long-term cooldown', async()=> {
            const result=await page.evaluate(async()=>{
              await clearStore('progress');
              const item=(window.__NATIVE_COACH_SEED__||[])[0];
              const before=Date.now();
              await persistIntensiveAnswer(item,'known','listening');
              const rec=await getOne('progress',item.id);
              const until=rec?.skills?.listening?.masteredUntil||0;
              await clearStore('progress');
              return {before,until};
            });
            if(result.until-result.before < 29*24*60*60*1000) throw new Error('cooldown too short '+JSON.stringify(result));
          });
          await check('correct TH phonetic cue', async()=> {
            const cue=await page.evaluate(()=>{
              const item=(window.__NATIVE_COACH_SEED__||[]).find(x=>x.term==='the thing is');
              return item?.phoneticFr;
            });
            if(cue!=='DHEU THING iz') throw new Error('wrong cue: '+cue);
          });
          await check('irregular list contains 140 verbs and 421 cards', async()=> {
            const result=await page.evaluate(async()=>{
              const r=await fetch('./irregular-verbs.json?qa='+Date.now(),{cache:'no-store'});
              const items=await r.json();
              return {
                cards:items.length,
                verbs:new Set(items.map(x=>x.verbNumber)).size,
                be:items.filter(x=>x.baseVerb==='be').map(x=>({term:x.term,phoneticFr:x.phoneticFr})),
                bad:items.filter(x=>!x.ipa||!x.phoneticFr||!x.example||!x.exampleIpa||!x.exampleFr).length
              };
            });
            if(result.cards!==421||result.verbs!==140||result.bad!==0) throw new Error(JSON.stringify(result));
            if(result.be.map(x=>x.term).join(',')!=='be,was,were,been') throw new Error('BE sequence '+JSON.stringify(result.be));
            if(result.be.map(x=>x.phoneticFr).join(',')!=='BII,WOZ,WEU,BIN') throw new Error('French-readable BE pronunciation '+JSON.stringify(result.be));
          });
          await check('irregular list can drive a training session', async()=> {
            const result=await page.evaluate(async()=>{
              activeList='irregular';updateListUI();
              const s=await buildSession('drive');
              activeList='general';updateListUI();
              return {corpus:421,session:s.length,all:s.every(x=>x.category==='irregular')};
            });
            if(!result.session||!result.all) throw new Error(JSON.stringify(result));
          });
          await check('irregular auto keeps complete verb blocks', async()=> {
            const result=await page.evaluate(async()=>{
              activeList='irregular';updateListUI();
              const s=await buildSession('drive');
              const first=s.slice(0,7).map(x=>x.term);
              const ordered=s.every((x,i)=>i===0 || x.verbNumber>s[i-1].verbNumber || (x.verbNumber===s[i-1].verbNumber && x.id.localeCompare(s[i-1].id)>=0));
              return {length:s.length,first,ordered,lastVerb:s.at(-1)?.verbNumber};
            });
            if(result.length!==421) throw new Error('wrong length '+JSON.stringify(result));
            if(result.first.join(',')!=='be,was,were,been,have,had,had') throw new Error('wrong first blocks '+JSON.stringify(result));
            if(!result.ordered || result.lastVerb!==140) throw new Error('not ordered '+JSON.stringify(result));
          });
          await check('mobile course uses AAC/M4A, not concatenated MP3', async()=> {
            const result=await page.evaluate(()=>{
              return {
                src:irregularCourseAudio.src,
                html:document.documentElement.innerHTML.includes('irregular-course.mp3')
              };
            });
            if(!result.src.includes('irregular-course-mobile.m4a')) throw new Error('wrong mobile course source '+JSON.stringify(result));
            if(result.html) throw new Error('old concatenated MP3 still referenced '+JSON.stringify(result));
          });
          await check('continuous irregular course has exact requested sequence', async()=> {
            const result=await page.evaluate(async()=>{
              const r=await fetch('./irregular-course-cues.json?qa='+Date.now(),{cache:'no-store'});
              const data=await r.json();
              const head=await fetch('./irregular-course-mobile.m4a',{method:'HEAD',cache:'no-store'});
              const first=data.cards[0], firstFour=data.cards.slice(0,4).map(x=>x.term);
              return {
                cards:data.cards.length,
                sequence:data.sequence,
                expectedDuration:data.expectedDuration,
                actualDuration:data.actualDuration,
                size:+(head.headers.get('content-length')||0),
                firstFour,
                phases:first.phases.map(p=>({phase:p.phase,repetition:p.repetition||0,start:p.start,end:p.end})),
                firstEnd:first.end,
                secondStart:data.cards[1].start
              };
            });
            if(result.cards!==421) throw new Error('wrong course cards '+JSON.stringify(result));
            if(result.firstFour.join(',')!=='be,was,were,been') throw new Error('wrong first block '+JSON.stringify(result));
            const expected=['word','think','french','repeat','repeat','repeat','example'];
            if(result.phases.map(x=>x.phase).join(',')!==expected.join(',')) throw new Error('wrong phase order '+JSON.stringify(result));
            if(result.phases.filter(x=>x.phase==='repeat').map(x=>x.repetition).join(',')!=='1,2,3') throw new Error('wrong repetition count '+JSON.stringify(result));
            const think=result.phases.find(x=>x.phase==='think');
            if(Math.abs((think.end-think.start)-2)>0.08) throw new Error('think gap is not 2 seconds '+JSON.stringify(result));
            if(Math.abs(result.firstEnd-result.secondStart)>0.01) throw new Error('cards do not chain directly '+JSON.stringify(result));
            if(Math.abs(result.expectedDuration-result.actualDuration)>0.1) throw new Error('course duration mismatch '+JSON.stringify(result));
            if(result.size<10000000) throw new Error('continuous course file missing or too small '+JSON.stringify(result));
          });
          await check('irregular auto opens manual resume picker', async()=> {
            const result=await page.evaluate(async()=>{
              activeList='irregular';updateListUI();
              await openIrregularStartPicker();
              return {
                picker:document.querySelector('#irregularStartView').classList.contains('active'),
                verbs:document.querySelector('#irregularVerbSelect').options.length,
                forms:[...document.querySelector('#irregularFormSelect').options].map(o=>o.textContent)
              };
            });
            if(!result.picker) throw new Error('picker did not open '+JSON.stringify(result));
            if(result.verbs!==140) throw new Error('wrong verb count '+JSON.stringify(result));
            if(result.forms.length!==4 || !result.forms[0].startsWith('BE') || !result.forms[1].startsWith('WAS') || !result.forms[2].startsWith('WERE') || !result.forms[3].startsWith('BEEN')) throw new Error('wrong BE forms '+JSON.stringify(result));
          });
          await check('manual picker starts unchanged auto course at chosen word', async()=> {
            const result=await page.evaluate(async()=>{
              activeList='irregular';updateListUI();
              await loadIrregularCourse();
              const chosen=irregularCourseCues[10];
              irregularSelectedStartId=chosen.id;
              await startIntensiveAuto();
              const oldPlay=irregularCourseAudio.play.bind(irregularCourseAudio);
              let plays=0;
              irregularCourseAudio.play=async()=>{plays++;};
              await document.querySelector('#startDrive').click();
              await new Promise(r=>setTimeout(r,50));
              const out={
                chosen:chosen.id,
                currentTime:irregularCourseAudio.currentTime,
                chosenStart:chosen.start,
                item:lastDriveItem?.id||null,
                plays,
                running:driveRunning
              };
              irregularCourseAudio.play=oldPlay;
              stopDrive();
              activeList='general';updateListUI();show('#homeView');
              return out;
            });
            if(result.item!==result.chosen) throw new Error('wrong chosen card '+JSON.stringify(result));
            if(Math.abs(result.currentTime-result.chosenStart)>.2) throw new Error('wrong chosen start time '+JSON.stringify(result));
            if(result.plays!==1 || !result.running) throw new Error('auto flow changed '+JSON.stringify(result));
          });
          await check('irregular auto uses one media play for the whole course', async()=> {
            const result=await page.evaluate(async()=>{
              activeList='irregular';updateListUI();
              await loadIrregularCourse();
              irregularSelectedStartId=irregularCourseCues[0]?.id||null;
              await startIntensiveAuto();
              const oldPlay=irregularCourseAudio.play.bind(irregularCourseAudio);
              let plays=0;
              irregularCourseAudio.play=async()=>{plays++;};
              await document.querySelector('#startDrive').click();
              await new Promise(r=>setTimeout(r,50));
              const running=driveRunning;
              const actions=document.querySelector('#driveActions').style.display;
              irregularCourseAudio.play=oldPlay;
              stopDrive();
              activeList='general';updateListUI();
              return {plays,running,actions};
            });
            if(result.plays!==1) throw new Error('expected one play call, got '+JSON.stringify(result));
            if(!result.running || result.actions!=='grid') throw new Error('course did not start '+JSON.stringify(result));
          });
          await check('intensive drill audio index', async()=> {
            const result=await page.evaluate(async()=>{
              const r=await fetch('./audio-index.json',{cache:'no-store'});
              const j=await r.json();
              const vals=Object.values(j);
              return {count:vals.length,drills:vals.filter(x=>x.drill).length,french:vals.filter(x=>x.french).length};
            });
            if(result.count!==541 || result.drills!==541 || result.french!==541) throw new Error('audio index incomplete '+JSON.stringify(result));
          });
          console.log('CHECKS\n'+checks.join('\n'));
          console.log('ERRORS\n'+(errors.length?errors.join('\n'):'NONE'));
          await browser.close();
          if(errors.length) process.exit(2);
          EOF
          node qa.mjs
