name: Native English Coach UI QA

on:
  workflow_dispatch:
  push:
    paths:
      - "native-english-coach/ui-qa-trigger.txt"

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium
      - name: Start static server
        run: |
          cd native-english-coach
          python3 -m http.server 4173 > /tmp/native-coach-server.log 2>&1 &
          echo $! > /tmp/native-coach-server.pid
          sleep 2
      - name: Run UI smoke test
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors=[];
          page.on('console', msg => { if (msg.type()==='error') errors.push('console: '+msg.text()); });
          page.on('pageerror', err => errors.push('pageerror: '+err.message));
          await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});
          const checks=[];
          async function check(name, fn){
            try{ await fn(); checks.push(name+': OK'); }
            catch(e){ checks.push(name+': FAIL '+e.message); errors.push(name+': '+e.stack); }
          }
          await check('home visible', async()=> {
            if(!(await page.locator('#homeView').evaluate(el=>el.classList.contains('active')))) throw new Error('home not active');
          });
          await check('settings', async()=> {
            await page.click('#settingsBtn'); await page.waitForTimeout(200);
            if(!(await page.locator('#settingsView').evaluate(el=>el.classList.contains('active')))) throw new Error('settings not active');
            await page.click('#settingsView [data-home]'); await page.waitForTimeout(100);
          });
          await check('normal mode + displayed word audio mapping', async()=> {
            await page.click('[data-mode="normal"]'); await page.waitForTimeout(300);
            if(!(await page.locator('#studyView').evaluate(el=>el.classList.contains('active')))) throw new Error('study not active');
            const displayed=(await page.locator('#term').textContent()).trim();
            const expected=await page.evaluate((term)=>{
              const item=(window.__NATIVE_COACH_SEED__||[]).find(x=>x.term===term);
              return item ? item.id+'-term.mp3' : null;
            },displayed);
            if(!expected) throw new Error('cannot resolve displayed term '+displayed);
            const reqPromise=page.waitForRequest(req=>req.url().includes('-term.mp3'),{timeout:6000});
            await page.click('#speakBtn');
            const req=await reqPromise;
            if(!req.url().includes(expected)) throw new Error('display/audio mismatch: '+displayed+' expected '+expected+' got '+req.url());
            await page.click('#studyView [data-home]'); await page.waitForTimeout(100);
          });
          await check('intensive auto mode', async()=> {
            await page.click('[data-mode="intensive-auto"]'); await page.waitForTimeout(300);
            if(!(await page.locator('#driveView').evaluate(el=>el.classList.contains('active')))) throw new Error('intensive auto view not active');
            if((await page.locator('#driveKnown').count())!==1 || (await page.locator('#driveUnknown').count())!==1) throw new Error('knowledge buttons missing');
            await page.click('#stopDrive'); await page.waitForTimeout(100);
          });
          await check('intensive calm mode', async()=> {
            await page.click('[data-mode="intensive-calm"]'); await page.waitForTimeout(300);
            if(!(await page.locator('#studyView').evaluate(el=>el.classList.contains('active')))) throw new Error('study not active');
            await page.click('#studyView [data-home]'); await page.waitForTimeout(100);
          });
          await check('listening mode', async()=> {
            await page.click('[data-mode="listening"]'); await page.waitForTimeout(500);
            if(!(await page.locator('#studyView').evaluate(el=>el.classList.contains('active')))) throw new Error('study not active');
            await page.click('#studyView [data-home]'); await page.waitForTimeout(100);
          });
          await check('speaking mode', async()=> {
            await page.click('[data-mode="speaking"]'); await page.waitForTimeout(300);
            if(!(await page.locator('#studyView').evaluate(el=>el.classList.contains('active')))) throw new Error('study not active');
            await page.click('#studyView [data-home]'); await page.waitForTimeout(100);
          });
          await check('browse', async()=> {
            await page.click('[data-mode="browse"]'); await page.waitForTimeout(300);
            if(!(await page.locator('#browseView').evaluate(el=>el.classList.contains('active')))) throw new Error('browse not active');
            if((await page.locator('#browseList .setting').count())===0) throw new Error('browse empty');
            await page.click('#browseView [data-home]'); await page.waitForTimeout(100);
          });
          await check('intensive sequence + instant known advance', async()=> {
            await page.click('[data-mode="intensive-auto"]');
            await page.waitForTimeout(150);
            await page.evaluate(()=>{
              window.__qaAudioKinds=[];
              window.__qaOriginalPlayNativeAudio=window.playNativeAudio;
              window.__qaOriginalWarmIntensiveAudio=window.warmIntensiveAudio;
              window.__qaOriginalRequestWake=window.requestWake;
              window.__qaOriginalWaitIntensive=window.waitIntensive;
              window.__qaOriginalMarkExposure=window.markExposure;
              window.__qaOriginalRateItem=window.rateItem;
              window.playNativeAudio=async(item,kind)=>{ window.__qaAudioKinds.push(kind); };
              window.warmIntensiveAudio=async()=>{};
              window.requestWake=async()=>{};
              window.waitIntensive=async()=>{};
              window.markExposure=async()=>{ await new Promise(r=>setTimeout(r,1500)); };
              window.rateItem=async()=>{ await new Promise(r=>setTimeout(r,1500)); };
              settings.thinkSeconds=0;
              settings.speakFrench=true;
            });
            await page.click('#startDrive');
            const first=(await page.locator('#driveTerm').textContent()).trim();
            await page.waitForFunction(()=>document.querySelector('#knowledgeQuestion').style.display==='block',{timeout:3000});
            const sequence=await page.evaluate(()=>window.__qaAudioKinds.slice(0,3));
            if(sequence.join(',')!=='term,french,drill') throw new Error('wrong intensive audio sequence '+sequence.join(','));
            const t0=Date.now();
            await page.click('#driveKnown');
            await page.waitForFunction(prev=>document.querySelector('#driveTerm').textContent.trim()!==prev,first,{timeout:600});
            const elapsed=Date.now()-t0;
            if(elapsed>550) throw new Error('known answer waited for persistence: '+elapsed+'ms');
            await page.click('#stopDrive');
            await page.evaluate(()=>{
              window.playNativeAudio=window.__qaOriginalPlayNativeAudio;
              window.warmIntensiveAudio=window.__qaOriginalWarmIntensiveAudio;
              window.requestWake=window.__qaOriginalRequestWake;
              window.waitIntensive=window.__qaOriginalWaitIntensive;
              window.markExposure=window.__qaOriginalMarkExposure;
              window.rateItem=window.__qaOriginalRateItem;
            });
            await page.waitForTimeout(100);
          });
          await check('unknown answer is reinserted later in same session', async()=> {
            await page.click('[data-mode="intensive-auto"]');
            await page.waitForTimeout(100);
            await page.evaluate(()=>{
              window.__qaOriginalPlayNativeAudio2=window.playNativeAudio;
              window.__qaOriginalWarmIntensiveAudio2=window.warmIntensiveAudio;
              window.__qaOriginalRequestWake2=window.requestWake;
              window.__qaOriginalWaitIntensive2=window.waitIntensive;
              window.playNativeAudio=async()=>{};
              window.warmIntensiveAudio=async()=>{};
              window.requestWake=async()=>{};
              window.waitIntensive=async()=>{};
              settings.thinkSeconds=0;
              settings.speakFrench=true;
            });
            await page.click('#startDrive');
            await page.waitForFunction(()=>document.querySelector('#knowledgeQuestion').style.display==='block',{timeout:3000});
            const firstId=await page.evaluate(()=>session[0].id);
            await page.click('#driveUnknown');
            await page.waitForTimeout(50);
            const retryIndex=await page.evaluate(id=>session.findIndex((x,i)=>i>0&&x.id===id),firstId);
            if(retryIndex<5 || retryIndex>7) throw new Error('unknown retry not spaced correctly: '+retryIndex);
            await page.click('#stopDrive');
            await page.evaluate(()=>{
              window.playNativeAudio=window.__qaOriginalPlayNativeAudio2;
              window.warmIntensiveAudio=window.__qaOriginalWarmIntensiveAudio2;
              window.requestWake=window.__qaOriginalRequestWake2;
              window.waitIntensive=window.__qaOriginalWaitIntensive2;
            });
            await page.waitForTimeout(100);
          });
          await check('known answer creates long-term cooldown', async()=> {
            const result=await page.evaluate(async()=>{
              await clearStore('progress');
              const item=(window.__NATIVE_COACH_SEED__||[])[0];
              const before=Date.now();
              await persistIntensiveAnswer(item,'known','listening');
              const rec=await getOne('progress',item.id);
              const until=rec?.skills?.listening?.masteredUntil||0;
              await clearStore('progress');
              return {before,until};
            });
            if(result.until-result.before < 29*24*60*60*1000) throw new Error('cooldown too short '+JSON.stringify(result));
          });
          await check('correct TH phonetic cue', async()=> {
            const cue=await page.evaluate(()=>{
              const item=(window.__NATIVE_COACH_SEED__||[]).find(x=>x.term==='the thing is');
              return item?.phoneticFr;
            });
            if(cue!=='DHEU THING iz') throw new Error('wrong cue: '+cue);
          });
          await check('irregular list contains 140 verbs and 421 cards', async()=> {
            const result=await page.evaluate(async()=>{
              const r=await fetch('./irregular-verbs.json?qa='+Date.now(),{cache:'no-store'});
              const items=await r.json();
              return {cards:items.length,verbs:new Set(items.map(x=>x.verbNumber)).size,be:items.filter(x=>x.baseVerb==='be').map(x=>x.term),bad:items.filter(x=>!x.ipa||!x.example||!x.exampleIpa||!x.exampleFr).length};
            });
            if(result.cards!==421||result.verbs!==140||result.bad!==0) throw new Error(JSON.stringify(result));
            if(result.be.join(',')!=='be,was,were,been') throw new Error('BE sequence '+result.be.join(','));
          });
          await check('irregular list can drive a training session', async()=> {
            const result=await page.evaluate(async()=>{
              activeList='irregular';updateListUI();
              const s=await buildSession('drive');
              activeList='general';updateListUI();
              return {corpus:421,session:s.length,all:s.every(x=>x.category==='irregular')};
            });
            if(!result.session||!result.all) throw new Error(JSON.stringify(result));
          });
          await check('intensive drill audio index', async()=> {
            const result=await page.evaluate(async()=>{
              const r=await fetch('./audio-index.json',{cache:'no-store'});
              const j=await r.json();
              const vals=Object.values(j);
              return {count:vals.length,drills:vals.filter(x=>x.drill).length,french:vals.filter(x=>x.french).length};
            });
            if(result.count!==541 || result.drills!==541 || result.french!==541) throw new Error('audio index incomplete '+JSON.stringify(result));
          });
          console.log('CHECKS\n'+checks.join('\n'));
          console.log('ERRORS\n'+(errors.length?errors.join('\n'):'NONE'));
          await browser.close();
          if(errors.length) process.exit(2);
          EOF
          node qa.mjs
